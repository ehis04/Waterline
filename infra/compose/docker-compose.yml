services:
  postgres:
    image: postgres:16-alpine
    container_name: waterline-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-waterline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-waterline_dev}
      POSTGRES_DB: ${POSTGRES_DB:-waterline}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-waterline} -d ${POSTGRES_DB:-waterline}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: python:3.12-slim
    container_name: waterline-api
    working_dir: /app
    volumes:
      - ../..:/app
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-waterline}:${POSTGRES_PASSWORD:-waterline_dev}@postgres:5432/${POSTGRES_DB:-waterline}
      PYTHONPATH: /app/packages/risk_core/src:/app/packages/dag/src:/app/packages/lookthrough/src:/app/packages/data_adapters/src:/app/services/api
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn pydantic numpy &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: node:21-alpine
    container_name: waterline-web
    working_dir: /app/apps/web
    volumes:
      - ../..:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: >
      sh -c "corepack enable &&
      pnpm install --frozen-lockfile || pnpm install &&
      pnpm dev --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
