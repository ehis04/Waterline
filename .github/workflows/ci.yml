name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Run tests
        run: |
          uv run pytest -v

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "21"
          cache: "pnpm"
      - name: Install web dependencies
        run: |
          pnpm --filter web install --frozen-lockfile || pnpm --filter web install
      - name: Run web tests
        run: |
          pnpm --filter web test
      - name: Build web app
        run: |
          pnpm --filter web build

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      - name: Verify synthetic data manifest SHA-256 hashes
        run: |
          if [ -f scripts/verify_synthetic_manifest.py ]; then
            uv run python scripts/verify_synthetic_manifest.py
          fi
      - name: Run security and redaction pytest suite
        run: |
          uv run pytest services/api/tests/test_security.py -v
      - name: Check for secrets and real PII patterns
        run: |
          uv run python - <<'PY'
          import re
          import subprocess
          import sys

          PATTERNS = [
              ("AWS Access Key", re.compile(r"AKIA[0-9A-Z]{16}")),
              ("Private Key Block", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH |PGP )?PRIVATE KEY-----")),
              ("GitHub Token", re.compile(r"gh[pousr]_[A-Za-z0-9]{36}")),
          ]

          files = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          hits = []
          for path in files:
              if path.endswith((".png", ".jpg", ".ico", ".svg", ".woff2", ".lock")):
                  continue
              try:
                  with open(path, "r", encoding="utf-8", errors="ignore") as f:
                      for lineno, line in enumerate(f, 1):
                          for label, pattern in PATTERNS:
                              if pattern.search(line):
                                  hits.append(f"{path}:{lineno}: matched {label}")
              except OSError:
                  continue

          if hits:
              print("\n".join(hits), file=sys.stderr)
              sys.exit(1)
          print(f"Scanned {len(files)} tracked files: no secret patterns found.")
          PY
